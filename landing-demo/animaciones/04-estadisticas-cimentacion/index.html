<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuko — Estadísticas (cimentación)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;800&display=swap');

    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --n-900: #0f172a;
      --n-600: #475569;
      --n-500: #64748b;
      --n-400: #94a3b8;
      --azul: #2563eb;
      --icon-blue: #3b82f6;
      --icon-green: #14b8a6;
      --icon-purple: #8b5cf6;
      --icon-orange: #f97316;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      overflow-x: hidden;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    .animation-viewport {
      width: 100%;
      max-width: 420px;
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: var(--bg);
      box-shadow: 0 10px 40px rgba(20, 24, 38, 0.1);
      padding: 18px 16px 20px;
    }

    .head-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--n-900);
      letter-spacing: -0.03em;
      line-height: 1.2;
      text-align: center;
    }

    .head-sub {
      margin-top: 6px;
      margin-left: auto;
      margin-right: auto;
      font-size: 12px;
      font-weight: 500;
      color: var(--n-500);
      line-height: 1.45;
      max-width: 34ch;
      text-align: center;
    }

    .period-row {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .period-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--n-600);
      margin-right: 4px;
    }

    .period-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .period-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: var(--card);
      color: var(--n-600);
      cursor: default;
      transition: background 0.55s ease, color 0.55s ease, border-color 0.55s ease, box-shadow 0.55s ease;
    }

    .period-pill.active {
      background: var(--azul);
      color: #fff;
      border-color: var(--azul);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    .stats-grid {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .stat-card {
      background: var(--card);
      border-radius: 14px;
      padding: 10px 10px 12px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      min-height: 104px;
      min-width: 0;
    }

    .stat-ic {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stat-ic svg {
      width: 20px;
      height: 20px;
    }

    .stat-ic.blue { background: rgba(59, 130, 246, 0.12); color: var(--icon-blue); }
    .stat-ic.teal { background: rgba(20, 184, 166, 0.12); color: var(--icon-green); }
    .stat-ic.purple { background: rgba(139, 92, 246, 0.12); color: var(--icon-purple); }
    .stat-ic.orange { background: rgba(249, 115, 22, 0.12); color: var(--icon-orange); }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--n-500);
      line-height: 1.25;
      min-height: 2.35em;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--n-900);
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
      margin-top: auto;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="animation-viewport" id="viewport">
    <h1 class="head-title">Estadísticas</h1>
    <p class="head-sub">Visualiza el rendimiento de tus grupos de compra colectiva</p>

    <div class="period-row">
      <span class="period-label">Período:</span>
      <div class="period-pills" role="tablist" aria-label="Período" id="demoPeriodTablist">
        <span class="period-pill">Diario</span>
        <span class="period-pill">Semanal</span>
        <span class="period-pill">Mensual</span>
        <span class="period-pill active">Todo</span>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-ic blue" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="6"/>
            <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <div class="stat-label">Grupos activos</div>
        <div class="stat-value" id="vActivos" data-type="int">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-ic teal" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
        </div>
        <div class="stat-label">Grupos exitosos</div>
        <div class="stat-value" id="vExitosos" data-type="int">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-ic purple" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="stat-label">Participantes totales</div>
        <div class="stat-value" id="vParticipantes" data-type="int">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-ic orange" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" opacity="0.9">
            <rect x="3" y="14" width="4" height="7" rx="1"/>
            <rect x="9" y="10" width="4" height="11" rx="1"/>
            <rect x="15" y="6" width="4" height="15" rx="1"/>
            <rect x="21" y="12" width="3" height="9" rx="0.8"/>
          </svg>
        </div>
        <div class="stat-label">Ingresos generados</div>
        <div class="stat-value" id="vIngresos" data-type="eur">0,00 €</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      let demoLang = 'es';

      function getStoredDemoLang() {
        try {
          return localStorage.getItem('tuko_lang') === 'en' ? 'en' : 'es';
        } catch (e) {
          return 'es';
        }
      }

      let fmtInt;
      let fmtEur;

      function rebuildFormatters() {
        const loc = demoLang === 'en' ? 'en-US' : 'es-ES';
        fmtInt = new Intl.NumberFormat(loc);
        fmtEur = new Intl.NumberFormat(loc, {
          style: 'currency',
          currency: 'EUR',
          minimumFractionDigits: 0,
          maximumFractionDigits: 0,
        });
      }

      const target = {
        activos: 8,
        exitosos: 53,
        participantes: 1417,
        ingresos: 31031,
      };

      const display = {
        activos: 0,
        exitosos: 0,
        participantes: 0,
        ingresos: 0,
      };

      const el = {
        activos: document.getElementById('vActivos'),
        exitosos: document.getElementById('vExitosos'),
        participantes: document.getElementById('vParticipantes'),
        ingresos: document.getElementById('vIngresos'),
      };

      const lastText = {
        activos: '',
        exitosos: '',
        participantes: '',
        ingresos: '',
      };

      function render(key, val) {
        const node = el[key];
        if (!node) return;
        const dtype = node.dataset.type;
        let s;
        if (dtype === 'int') s = fmtInt.format(Math.round(val));
        else if (dtype === 'eur') s = fmtEur.format(val);
        if (s === lastText[key]) return;
        lastText[key] = s;
        node.textContent = s;
      }

      function applyDemoLang(lang) {
        demoLang = lang === 'en' ? 'en' : 'es';
        document.documentElement.lang = demoLang;
        const en = demoLang === 'en';
        rebuildFormatters();
        lastText.activos = '';
        lastText.exitosos = '';
        lastText.participantes = '';
        lastText.ingresos = '';

        const ht = document.querySelector('.head-title');
        if (ht) ht.textContent = en ? 'Statistics' : 'Estadísticas';
        const hs = document.querySelector('.head-sub');
        if (hs) {
          hs.textContent = en
            ? 'See how your group buys are performing.'
            : 'Visualiza el rendimiento de tus grupos de compra colectiva';
        }
        const plab = document.querySelector('.period-label');
        if (plab) plab.textContent = en ? 'Period:' : 'Período:';
        const tablist = document.getElementById('demoPeriodTablist');
        if (tablist) tablist.setAttribute('aria-label', en ? 'Period' : 'Período');

        const pills = document.querySelectorAll('.period-pill');
        const pillEs = ['Diario', 'Semanal', 'Mensual', 'Todo'];
        const pillEn = ['Daily', 'Weekly', 'Monthly', 'All'];
        const pillTxt = en ? pillEn : pillEs;
        pills.forEach((p, i) => {
          if (pillTxt[i]) p.textContent = pillTxt[i];
        });

        const labs = document.querySelectorAll('.stat-label');
        const labEs = [
          'Grupos activos',
          'Grupos exitosos',
          'Participantes totales',
          'Ingresos generados',
        ];
        const labEn = [
          'Active groups',
          'Successful groups',
          'Total participants',
          'Revenue generated',
        ];
        const labTxt = en ? labEn : labEs;
        labs.forEach((p, i) => {
          if (labTxt[i]) p.textContent = labTxt[i];
        });
      }

      window.addEventListener('message', function (ev) {
        if (!ev.data || ev.data.type !== 'tuko-demo-lang') return;
        applyDemoLang(ev.data.lang);
      });

      rebuildFormatters();
      applyDemoLang(getStoredDemoLang());

      /** 20 s de subida 0 → cifra (los cuatro en paralelo), pausa, reset a 0 y bucle. */
      const COUNT_UP_MS = 20000;
      const HOLD_TOP_MS = 2800;
      const HOLD_BOTTOM_MS = 1400;
      const CYCLE_MS = COUNT_UP_MS + HOLD_TOP_MS + HOLD_BOTTOM_MS;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const t0 = performance.now();

      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function tickDisplay(now) {
        if (reduceMotion) {
          display.activos = target.activos;
          display.exitosos = target.exitosos;
          display.participantes = target.participantes;
          display.ingresos = target.ingresos;
          render('activos', display.activos);
          render('exitosos', display.exitosos);
          render('participantes', display.participantes);
          render('ingresos', display.ingresos);
          return;
        }

        const elapsed = (now - t0) % CYCLE_MS;

        if (elapsed < COUNT_UP_MS) {
          const u = easeInOutCubic(elapsed / COUNT_UP_MS);
          display.activos = Math.round(target.activos * u);
          display.exitosos = Math.round(target.exitosos * u);
          display.participantes = Math.round(target.participantes * u);
          display.ingresos = target.ingresos * u;
        } else if (elapsed < COUNT_UP_MS + HOLD_TOP_MS) {
          display.activos = target.activos;
          display.exitosos = target.exitosos;
          display.participantes = target.participantes;
          display.ingresos = target.ingresos;
        } else {
          display.activos = 0;
          display.exitosos = 0;
          display.participantes = 0;
          display.ingresos = 0;
        }

        render('activos', display.activos);
        render('exitosos', display.exitosos);
        render('participantes', display.participantes);
        render('ingresos', display.ingresos);

        requestAnimationFrame(tickDisplay);
      }

      requestAnimationFrame(tickDisplay);
    })();
  </script>
</body>
</html>
