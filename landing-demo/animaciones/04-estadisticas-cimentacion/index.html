<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuko — Estadísticas (cimentación)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;800&display=swap');

    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --n-900: #0f172a;
      --n-600: #475569;
      --n-500: #64748b;
      --n-400: #94a3b8;
      --azul: #2563eb;
      --icon-blue: #3b82f6;
      --icon-green: #14b8a6;
      --icon-purple: #8b5cf6;
      --icon-orange: #f97316;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .animation-viewport {
      width: 100%;
      max-width: 400px;
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: var(--bg);
      box-shadow: 0 10px 40px rgba(20, 24, 38, 0.1);
      padding: 22px 18px 24px;
    }

    .head-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--n-900);
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .head-sub {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--n-500);
      line-height: 1.45;
      max-width: 34ch;
    }

    .period-row {
      margin-top: 18px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .period-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--n-600);
      margin-right: 4px;
    }

    .period-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .period-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: var(--card);
      color: var(--n-600);
      cursor: default;
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    .period-pill.active {
      background: var(--azul);
      color: #fff;
      border-color: var(--azul);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    .stats-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-card {
      background: var(--card);
      border-radius: 14px;
      padding: 12px 12px 14px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    .stat-ic {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stat-ic svg {
      width: 20px;
      height: 20px;
    }

    .stat-ic.blue { background: rgba(59, 130, 246, 0.12); color: var(--icon-blue); }
    .stat-ic.teal { background: rgba(20, 184, 166, 0.12); color: var(--icon-green); }
    .stat-ic.purple { background: rgba(139, 92, 246, 0.12); color: var(--icon-purple); }
    .stat-ic.orange { background: rgba(249, 115, 22, 0.12); color: var(--icon-orange); }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--n-400);
      line-height: 1.3;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--n-900);
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }
  </style>
</head>
<body>
  <div class="animation-viewport" id="viewport">
    <h1 class="head-title">Estadísticas</h1>
    <p class="head-sub">Visualiza el rendimiento de tus grupos de compra colectiva</p>

    <div class="period-row">
      <span class="period-label">Período:</span>
      <div class="period-pills" role="tablist" aria-label="Período">
        <span class="period-pill">Diario</span>
        <span class="period-pill">Semanal</span>
        <span class="period-pill">Mensual</span>
        <span class="period-pill active">Todo</span>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-ic blue" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="6"/>
            <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <div class="stat-label">Grupos activos</div>
        <div class="stat-value" id="vActivos" data-type="int">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-ic teal" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
        </div>
        <div class="stat-label">Grupos exitosos</div>
        <div class="stat-value" id="vExitosos" data-type="int">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-ic purple" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="stat-label">Participantes totales</div>
        <div class="stat-value" id="vParticipantes" data-type="int">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-ic orange" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" opacity="0.9">
            <rect x="3" y="14" width="4" height="7" rx="1"/>
            <rect x="9" y="10" width="4" height="11" rx="1"/>
            <rect x="15" y="6" width="4" height="15" rx="1"/>
            <rect x="21" y="12" width="3" height="9" rx="0.8"/>
          </svg>
        </div>
        <div class="stat-label">Ingresos generados</div>
        <div class="stat-value" id="vIngresos" data-type="eur">0,00 €</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const fmtInt = new Intl.NumberFormat('es-ES');
      const fmtEur = new Intl.NumberFormat('es-ES', {
        style: 'currency',
        currency: 'EUR',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
      /** Totales reales (saltan con la lógica); la pantalla los persigue suavemente. */
      const target = {
        activos: 0,
        exitosos: 0,
        participantes: 0,
        ingresos: 0,
      };

      /** Valores mostrados (interpolados). */
      const display = {
        activos: 0,
        exitosos: 0,
        participantes: 0,
        ingresos: 0,
      };

      const el = {
        activos: document.getElementById('vActivos'),
        exitosos: document.getElementById('vExitosos'),
        participantes: document.getElementById('vParticipantes'),
        ingresos: document.getElementById('vIngresos'),
      };

      const lastText = {
        activos: '',
        exitosos: '',
        participantes: '',
        ingresos: '',
      };

      function render(key, val) {
        const node = el[key];
        if (!node) return;
        const t = node.dataset.type;
        let s;
        if (t === 'int') s = fmtInt.format(Math.round(val));
        else if (t === 'eur') s = fmtEur.format(val);
        if (s === lastText[key]) return;
        lastText[key] = s;
        node.textContent = s;
      }

      function randInt(a, b) {
        return a + Math.floor(Math.random() * (b - a + 1));
      }

      /**
       * GMV (ventas totales de marca, no margen de plataforma).
       * Cada participante cuenta como un pedido ≈ AOV; GMV acumulado = suma(Δparticipantes × AOV en ese instante).
       * Participantes solo entran por grupos exitosos, ~20–30 por cierre.
       *
       * AOV de referencia ~25 € (banda 22–28 €). GMV = participantes × AOV por tramo.
       */
      const USE_COHERENT_START = false;
      const COHERENT_START = {
        exitosos: 80,
        participantes: 2000,
        ingresos: 2000 * 25,
        aov: 25,
      };

      let liveAOV = 24 + Math.random() * 2;

      function evolveEconomia() {
        liveAOV += (Math.random() - 0.5) * 0.35;
        liveAOV = Math.max(22, Math.min(28, liveAOV));
      }

      /** Entero hacia objetivo (~10 % más rápido que antes). */
      function chaseInt(from, to) {
        if (from === to) return from;
        const diff = to - from;
        const ad = Math.abs(diff);
        const sign = diff > 0 ? 1 : -1;
        const step = Math.min(ad, Math.max(1, Math.ceil(ad * 0.13)));
        return from + sign * step;
      }

      /** Euros hacia objetivo (~10 % más rápido). */
      function chaseMoney(from, to) {
        const diff = to - from;
        const ad = Math.abs(diff);
        if (ad < 0.005) return to;
        const sign = diff > 0 ? 1 : -1;
        const cents = ad * 100;
        const centStep = Math.min(cents, Math.max(1, Math.ceil(cents * 0.16)));
        return from + (sign * centStep) / 100;
      }

      /** Solo cierres: más grupos exitosos por pulso (2–5); 20–30 compradores por grupo; GMV += personas × AOV. */
      function pulseGruposExitosos() {
        const nuevosGrupos = randInt(2, 5);
        let personasNuevas = 0;
        for (let g = 0; g < nuevosGrupos; g++) {
          personasNuevas += randInt(20, 30);
        }
        const aov = liveAOV;
        target.exitosos += nuevosGrupos;
        target.participantes += personasNuevas;
        target.ingresos += personasNuevas * aov;

        nudgeGruposActivos();
      }

      /** Grupos activos en torno a 7–8 (con ligera oscilación 6–10). */
      function nudgeGruposActivos() {
        if (target.activos === 0) {
          target.activos = randInt(7, 8);
          return;
        }
        if (target.activos < 7 && Math.random() < 0.45) {
          target.activos += 1;
          return;
        }
        if (target.activos > 8 && Math.random() < 0.4) {
          target.activos -= 1;
          return;
        }
        if (Math.random() < 0.14) target.activos += 1;
        else if (Math.random() < 0.1 && target.activos > 6) target.activos -= 1;
        target.activos = Math.max(6, Math.min(10, target.activos));
      }

      function startGrowthLoop() {
        target.activos = randInt(7, 8);
        if (USE_COHERENT_START) {
          liveAOV = COHERENT_START.aov;
          target.exitosos = COHERENT_START.exitosos;
          target.participantes = COHERENT_START.participantes;
          target.ingresos = COHERENT_START.ingresos;
        } else {
          pulseGruposExitosos();
        }
        setInterval(pulseGruposExitosos, 473);
        setInterval(evolveEconomia, 1818);
      }

      function tickDisplay() {
        display.activos = chaseInt(display.activos, target.activos);
        display.exitosos = chaseInt(display.exitosos, target.exitosos);
        display.participantes = chaseInt(display.participantes, target.participantes);
        display.ingresos = chaseMoney(display.ingresos, target.ingresos);

        render('activos', display.activos);
        render('exitosos', display.exitosos);
        render('participantes', display.participantes);
        render('ingresos', display.ingresos);

        requestAnimationFrame(tickDisplay);
      }

      startGrowthLoop();
      requestAnimationFrame(tickDisplay);
    })();
  </script>
</body>
</html>
