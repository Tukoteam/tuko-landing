<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuko — Cómo unirte al grupo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap');

    /* Colores de marca — Colores de Marca.pdf */
    :root {
      --n-white: #ffffff;
      --n-50: #f5f5f5;
      --n-200: #d9d9d9;
      --n-400: #a0a0a0;
      --n-600: #4d4d4d;
      --n-900: #222222;
      --azul-light: #e0e7ff;
      --azul-mid: #a4b3f2;
      --azul-primario: #3d50f2;
      --azul-oscuro: #141826;
      --menta-light: #c3f5e7;
      --menta-mid: #74e0c2;
      --menta: #14c492;
      --menta-oscuro: #06444b;
      --rojo-persa: #ce3333;
      --rojo-persa-oscuro: #5e1e27;
      --shadow: 0 10px 40px rgba(20, 24, 38, 0.08);
      --shadow-cta: 0 4px 24px rgba(61, 80, 242, 0.22);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--n-50);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .animation-viewport {
      width: 100%;
      max-width: 360px;
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: var(--n-white);
      box-shadow: var(--shadow);
      aspect-ratio: 9 / 10;
    }

    .scene {
      width: 100%;
      height: 100%;
      padding: 32px 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      transform-origin: 50% 58%;
      transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .scene.zoomed {
      transform: scale(1.08);
    }

    .scene-hint {
      font-size: 14px;
      font-weight: 600;
      color: var(--n-900);
      text-align: center;
      line-height: 1.35;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .scene-sub {
      font-size: 12px;
      font-weight: 500;
      color: var(--n-600);
      text-align: center;
      line-height: 1.4;
      margin-bottom: 22px;
    }

    .tuko-cta {
      width: 100%;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--azul-primario);
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-cta);
      transition:
        transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.32s ease,
        background 0.32s ease;
    }

    .tuko-cta.hover {
      transform: scale(1.03);
      background: #4d5ff5;
      box-shadow: 0 8px 32px rgba(61, 80, 242, 0.35);
    }

    .tuko-cta.pressed {
      transform: scale(0.96);
      box-shadow: 0 2px 12px rgba(20, 24, 38, 0.15);
    }

    .tuko-cta.joining {
      background: var(--azul-oscuro);
    }

    .tuko-cta.success {
      background: linear-gradient(135deg, var(--menta-oscuro) 0%, #0d5c5c 100%);
      box-shadow: 0 4px 24px rgba(6, 68, 75, 0.25);
    }

    .cta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.28s ease;
    }

    .cta-row.hidden {
      opacity: 0;
      pointer-events: none;
      position: absolute;
    }

    .cta-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      stroke: #fff;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cta-label {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.01em;
    }

    .cta-progress-track {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 7px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .tuko-cta.joining .cta-progress-track { opacity: 1; }

    .cta-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--menta-mid), var(--menta));
      transition: width 0.05s linear;
    }

    .cta-check {
      width: 22px;
      height: 22px;
      stroke: #fff;
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cursor {
      position: absolute;
      width: 26px;
      height: 26px;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      filter: drop-shadow(0 2px 6px rgba(20, 24, 38, 0.2));
      transition: opacity 0.45s ease;
    }

    .cursor.visible { opacity: 1; }

    .cursor.clicking {
      transform: scale(0.88);
      transition: transform 0.1s ease;
    }

    .click-ripple {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      transform: scale(0);
      pointer-events: none;
      z-index: 5;
    }

    @keyframes ripple-out {
      to { transform: scale(2.2); opacity: 0; }
    }

    .click-ripple.active {
      animation: ripple-out 0.55s ease-out forwards;
    }

    /* Secundario: compartir (Rojo Persa — distinto del azul / verde menta) */
    .share-btn {
      position: relative;
      margin-top: 14px;
      width: 100%;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 999px;
      border: none;
      background: var(--rojo-persa);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(206, 51, 51, 0.28);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition:
        opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .share-btn.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .share-btn.visible.hover {
      transform: translateY(0) scale(1.03);
      background: #b92d2d;
      box-shadow: 0 6px 22px rgba(206, 51, 51, 0.35);
    }

    .share-btn.visible.pressed {
      transform: translateY(0) scale(0.96);
      box-shadow: 0 2px 10px rgba(206, 51, 51, 0.22);
    }

    .share-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <div class="animation-viewport" id="viewport">
    <div class="scene" id="scene">
      <p class="scene-hint">Cómo te unes al grupo</p>
      <p class="scene-sub">Pulsa el botón para entrar en la compra colectiva.</p>

      <div class="tuko-cta" id="cta" role="img" aria-label="Demostración: unirse al grupo">
        <div class="cta-row" id="ctaContent">
          <svg class="cta-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span class="cta-label" id="ctaLabel">Únete al grupo</span>
        </div>
        <div class="cta-row hidden" id="ctaSuccessRow">
          <svg class="cta-check" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          <span class="cta-label" id="ctaSuccessLabel">Dentro del grupo</span>
        </div>
        <div class="cta-progress-track" aria-hidden="true">
          <div class="cta-progress-fill" id="ctaProgressFill"></div>
        </div>
      </div>

      <button type="button" class="share-btn" id="shareBtn" aria-label="Compartir el grupo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        Compartir
      </button>
    </div>

    <svg class="cursor" id="cursor" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5.5 3.21V20.8a.55.55 0 0 0 .95.39l4.3-4.55h6.05a.55.55 0 0 0 .39-.95L5.89 3.21a.28.28 0 0 0-.39.0z" fill="#fff" stroke="#222222" stroke-width="1"/>
    </svg>
  </div>

  <script>
    (function () {
      const TIMING = {
        cursorAppear: 300,
        zoomStart: 550,
        cursorMove: 1200,
        hoverBtn: 1650,
        clickDown: 2050,
        clickUp: 2180,
        loadStart: 2240,
        progressEnd: 3000,
        showSuccess: 3100,
        celebrate: 4000,
        shareCursorShow: 4560,
        shareMoveMs: 900,
        shareHover: 5580,
        shareClickDown: 5880,
        shareClickUp: 6020,
        resetFade: 6900,
        resetDone: 7550,
        loopDelay: 8000,
      };

      const $ = (id) => document.getElementById(id);
      let loopTimer = null;
      let cursorRaf = null;
      let progressRaf = null;

      function runAnimation() {
        resetState();

        const cursor = $('cursor');
        const scene = $('scene');
        const cta = $('cta');
        const ctaContent = $('ctaContent');
        const ctaSuccessRow = $('ctaSuccessRow');
        const ctaProgressFill = $('ctaProgressFill');
        const shareBtn = $('shareBtn');
        const viewport = $('viewport');

        const vpRect = viewport.getBoundingClientRect();
        let curX = vpRect.width * 0.78;
        let curY = vpRect.height * 0.2;
        setCursorPos(curX, curY);

        const ctaCenter = () => {
          const r = cta.getBoundingClientRect();
          const vr = viewport.getBoundingClientRect();
          return {
            x: r.left - vr.left + r.width / 2 - 13,
            y: r.top - vr.top + r.height / 2 - 13,
          };
        };

        const shareBtnCenter = () => {
          const r = shareBtn.getBoundingClientRect();
          const vr = viewport.getBoundingClientRect();
          return {
            x: r.left - vr.left + r.width / 2 - 13,
            y: r.top - vr.top + r.height / 2 - 13,
          };
        };

        at(TIMING.cursorAppear, () => cursor.classList.add('visible'));
        at(TIMING.zoomStart, () => scene.classList.add('zoomed'));

        const end = ctaCenter();
        animateCursor(curX, curY, end.x, end.y, TIMING.cursorAppear + 120, TIMING.cursorMove);

        at(TIMING.hoverBtn, () => cta.classList.add('hover'));

        at(TIMING.clickDown, () => {
          cta.classList.remove('hover');
          cta.classList.add('pressed');
          cursor.classList.add('clicking');
          const ripple = document.createElement('div');
          ripple.className = 'click-ripple';
          ripple.style.left = '50%';
          ripple.style.top = '50%';
          ripple.style.marginLeft = '-24px';
          ripple.style.marginTop = '-24px';
          cta.appendChild(ripple);
          requestAnimationFrame(() => ripple.classList.add('active'));
          setTimeout(() => ripple.remove(), 600);
        });

        at(TIMING.clickUp, () => {
          cta.classList.remove('pressed');
          cursor.classList.remove('clicking');
        });

        at(TIMING.loadStart, () => {
          cta.classList.add('joining');
          cursor.style.opacity = '0.35';
          runButtonProgress(ctaProgressFill, TIMING.progressEnd - TIMING.loadStart);
        });

        at(TIMING.showSuccess, () => {
          if (progressRaf) {
            cancelAnimationFrame(progressRaf);
            progressRaf = null;
          }
          ctaProgressFill.style.width = '100%';
          cta.classList.remove('joining');
          cta.classList.add('success');
          ctaContent.classList.add('hidden');
          ctaSuccessRow.classList.remove('hidden');
          cursor.style.opacity = '0';
        });

        at(TIMING.celebrate, () => {
          scene.classList.remove('zoomed');
          shareBtn.classList.add('visible');
        });

        at(TIMING.shareCursorShow, () => {
          requestAnimationFrame(() => {
            const from = ctaCenter();
            const to = shareBtnCenter();
            cursor.style.opacity = '1';
            cursor.classList.add('visible');
            setCursorPos(from.x, from.y);
            animateCursor(
              from.x,
              from.y,
              to.x,
              to.y,
              80,
              TIMING.shareMoveMs
            );
          });
        });

        at(TIMING.shareHover, () => shareBtn.classList.add('hover'));

        at(TIMING.shareClickDown, () => {
          shareBtn.classList.remove('hover');
          shareBtn.classList.add('pressed');
          cursor.classList.add('clicking');
          const ripple = document.createElement('div');
          ripple.className = 'click-ripple';
          ripple.style.left = '50%';
          ripple.style.top = '50%';
          ripple.style.marginLeft = '-24px';
          ripple.style.marginTop = '-24px';
          ripple.style.background = 'rgba(255, 255, 255, 0.4)';
          shareBtn.appendChild(ripple);
          requestAnimationFrame(() => ripple.classList.add('active'));
          setTimeout(() => ripple.remove(), 600);
        });

        at(TIMING.shareClickUp, () => {
          shareBtn.classList.remove('pressed');
          cursor.classList.remove('clicking');
          cursor.style.opacity = '0';
        });

        at(TIMING.resetFade, () => {
          viewport.style.transition = 'opacity 0.5s ease';
          viewport.style.opacity = '0';
        });

        at(TIMING.resetDone, () => {
          viewport.style.opacity = '1';
        });

        loopTimer = setTimeout(runAnimation, TIMING.loopDelay);
      }

      function at(ms, fn) {
        setTimeout(fn, ms);
      }

      function setCursorPos(x, y) {
        $('cursor').style.left = x + 'px';
        $('cursor').style.top = y + 'px';
      }

      function animateCursor(fromX, fromY, toX, toY, startAt, duration) {
        const startTime = performance.now() + startAt;
        function step(now) {
          const elapsed = now - startTime;
          if (elapsed < 0) {
            cursorRaf = requestAnimationFrame(step);
            return;
          }
          const t = Math.min(elapsed / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          setCursorPos(
            fromX + (toX - fromX) * ease,
            fromY + (toY - fromY) * ease
          );
          if (t < 1) cursorRaf = requestAnimationFrame(step);
          else cursorRaf = null;
        }
        cursorRaf = requestAnimationFrame(step);
      }

      function runButtonProgress(el, totalMs) {
        const start = performance.now();
        function tick(now) {
          const p = Math.min((now - start) / totalMs, 1);
          el.style.width = p * 92 + '%';
          if (p < 1) progressRaf = requestAnimationFrame(tick);
          else progressRaf = null;
        }
        el.style.width = '0%';
        progressRaf = requestAnimationFrame(tick);
      }

      function resetState() {
        if (loopTimer) clearTimeout(loopTimer);
        if (cursorRaf) cancelAnimationFrame(cursorRaf);
        if (progressRaf) cancelAnimationFrame(progressRaf);
        cursorRaf = null;
        progressRaf = null;

        const viewport = $('viewport');
        const cursor = $('cursor');
        const scene = $('scene');
        const cta = $('cta');
        const ctaContent = $('ctaContent');
        const ctaSuccessRow = $('ctaSuccessRow');
        const ctaProgressFill = $('ctaProgressFill');
        const shareBtn = $('shareBtn');

        viewport.style.opacity = '1';
        viewport.style.transition = 'none';
        cursor.classList.remove('visible', 'clicking');
        cursor.style.opacity = '';
        scene.classList.remove('zoomed');
        cta.className = 'tuko-cta';
        ctaContent.classList.remove('hidden');
        ctaSuccessRow.classList.add('hidden');
        ctaSuccessRow.querySelector('.cta-label').textContent = 'Dentro del grupo';
        $('ctaLabel').textContent = 'Únete al grupo';
        ctaProgressFill.style.width = '0%';
        shareBtn.classList.remove('visible', 'hover', 'pressed');
      }

      const shareBtnEl = $('shareBtn');
      if (shareBtnEl && !shareBtnEl.dataset.shareBound) {
        shareBtnEl.dataset.shareBound = '1';
        shareBtnEl.addEventListener('click', () => {
          if (navigator.share) {
            navigator
              .share({
                title: 'Tuko',
                text: '¡Mira esta compra grupal!',
                url: window.location.href,
              })
              .catch(() => {});
          }
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', runAnimation);
      } else {
        runAnimation();
      }
    })();
  </script>
</body>
</html>
