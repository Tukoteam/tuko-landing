<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>OG</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Mona+Sans:wght@700;800&family=Roboto+Serif:ital,wght@1,700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Mona Sans', system-ui, sans-serif;
    background: #f7f8fc;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .glow-tl {
    position: absolute; left: 140px; top: -40px; width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(180,140,255,0.32) 0%, rgba(180,140,255,0) 68%);
    pointer-events: none;
  }
  .glow-tr {
    position: absolute; right: 160px; top: 50px; width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(120,210,200,0.26) 0%, rgba(120,210,200,0) 70%);
    pointer-events: none;
  }
  .grid {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 34%;
    background:
      linear-gradient(to top, rgba(247,248,252,0.1) 0%, rgba(247,248,252,0.95) 100%),
      repeating-linear-gradient(90deg, transparent 0, transparent 40px, rgba(90,100,140,0.13) 40px, rgba(90,100,140,0.13) 41px),
      repeating-linear-gradient(0deg, transparent 0, transparent 22px, rgba(90,100,140,0.11) 22px, rgba(90,100,140,0.11) 23px);
    transform: perspective(420px) rotateX(52deg);
    transform-origin: 50% 100%;
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.45) 0%, transparent 100%);
    mask-image: linear-gradient(to top, rgba(0,0,0,0.45) 0%, transparent 100%);
    pointer-events: none;
  }
  .safe {
    position: relative;
    z-index: 2;
    width: 580px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .logo {
    height: 88px;
    width: auto;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 52px;
    line-height: 1.08;
    font-weight: 800;
    font-stretch: semi-expanded;
    color: #1a1a1a;
    letter-spacing: -0.035em;
    width: 100%;
  }
  .accent {
    font-family: 'Roboto Serif', Georgia, serif;
    font-style: italic;
    font-weight: 700;
    font-size: 56px;
    color: #3D50F2;
    position: relative;
    display: inline-block;
    padding: 0 4px 8px;
  }
  .accent::after {
    content: '';
    position: absolute;
    left: 2%;
    right: 2%;
    bottom: 5px;
    height: 5px;
    background: #3D50F2;
    border-radius: 99px;
    transform: rotate(-1.2deg);
  }
  .cta {
    margin-top: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #3D50F2;
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    font-stretch: semi-expanded;
    padding: 20px 40px;
    border-radius: 18px;
    letter-spacing: -0.01em;
  }
  .cta svg {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="glow-tl"></div>
  <div class="glow-tr"></div>
  <div class="grid" aria-hidden="true"></div>
  <div class="safe">
    <img class="logo" src="logos/3. Negro.svg" alt="tuko" width="300" height="115">
    <h1>
      Un botón y tus<br>
      clientes empiezan<br>
      a <span class="accent">vender</span><br>
      por ti
    </h1>
    <div class="cta">
      Instalar gratis
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6.5 8.5V7a5.5 5.5 0 0 1 11 0v1.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M5 9.5h14l-1.2 11.2a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3L5 9.5Z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</body>
</html>
