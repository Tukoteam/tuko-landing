<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>OG</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,300;0,700;0,800;1,700&family=Roboto+Serif:ital,wght@1,700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Mona Sans', system-ui, sans-serif;
    background: #fff;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }
  .glow-tl {
    position: absolute; left: -120px; top: -140px; width: 520px; height: 520px;
    background: radial-gradient(circle, rgba(61,80,242,0.18) 0%, rgba(61,80,242,0) 70%);
    pointer-events: none;
  }
  .glow-br {
    position: absolute; right: -100px; bottom: -160px; width: 480px; height: 480px;
    background: radial-gradient(circle, rgba(164,179,242,0.22) 0%, rgba(164,179,242,0) 70%);
    pointer-events: none;
  }
  .logo {
    height: 52px; width: auto; margin-bottom: 36px;
    position: relative; z-index: 1;
  }
  h1 {
    position: relative; z-index: 1;
    text-align: center;
    font-size: 52px;
    line-height: 1.18;
    font-weight: 800;
    font-stretch: semi-expanded;
    color: #1a1a1a;
    max-width: 980px;
    letter-spacing: -0.02em;
  }
  .accent {
    font-family: 'Roboto Serif', Georgia, serif;
    font-style: italic;
    font-weight: 700;
    color: #3D50F2;
    position: relative;
    display: inline-block;
    padding: 0 2px 2px;
  }
  .accent::after {
    content: '';
    position: absolute;
    left: 2%;
    right: 2%;
    bottom: 2px;
    height: 3px;
    background: #3D50F2;
    border-radius: 2px;
    transform: skewX(-8deg);
    opacity: 0.95;
  }
  .sub {
    position: relative; z-index: 1;
    margin-top: 22px;
    font-size: 20px;
    font-weight: 400;
    color: #333333;
    letter-spacing: 0.01em;
  }
  .cta {
    position: relative; z-index: 1;
    margin-top: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #3D50F2;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    font-stretch: semi-expanded;
    padding: 16px 32px;
    border-radius: 14px;
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
  <div class="glow-tl"></div>
  <div class="glow-br"></div>
  <img class="logo" src="logos/3. Negro.svg" alt="tuko">
  <h1>Un botón y tus clientes empiezan<br><span class="accent">vender</span> por ti</h1>
  <p class="sub">Instalación en 2 minutos · gratis hasta que vendas</p>
  <div class="cta">Instalar gratis en Shopify</div>
</body>
</html>
