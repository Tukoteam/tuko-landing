name: landing-checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build site (concat parts, partials, ?v=)
        run: npm run build
      - name: Working tree must stay clean after build
        run: git diff --exit-code
      - name: Run site checks
        run: npm run check:site
