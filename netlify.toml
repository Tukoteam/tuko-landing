# Configuración de despliegue de Tuko.
# Netlify sirve Brotli y Gzip automáticamente y habla HTTP/2 y HTTP/3;
# aquí se define el cacheado, la seguridad y las redirecciones canónicas.

[build]
  publish = "."

# ── Cabeceras por defecto: seguridad para todo el sitio ──
[[headers]]
  for = "/*"
  [headers.values]
    # Fuerza HTTPS durante un año, incluidos subdominios
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Impide que el navegador adivine tipos MIME
    X-Content-Type-Options = "nosniff"
    # Evita que la web se embeba en iframes ajenos (clickjacking)
    X-Frame-Options = "SAMEORIGIN"
    # No filtra la URL completa a terceros
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Desactiva APIs del navegador que la web no usa
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # CSP: permite lo que la web realmente necesita (Google Fonts, YouTube, formulario de Netlify)
    # img-src https: — permite imágenes del blog (propias y URLs pegadas en el CMS)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# ── El HTML se revalida siempre: los cambios se ven al instante ──
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Imágenes: cache larga (los nombres de archivo no cambian) ──
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/logos colaboradores/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── CSS y JS: llevan ?v= en la URL, así que se pueden cachear un año ──
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Ficheros de rastreo: una hora ──
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ── URLs canónicas: una sola versión de cada página ──
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/index.html"
  to = "/blog/"
  status = 301
  force = true

