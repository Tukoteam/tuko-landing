<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Producto de ejemplo para la página de Lanzamientos: sudadera verde salvia sobre fondo de estudio -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#f4f2ed"/>
      <stop offset="1" stop-color="#e4e0d7"/>
    </radialGradient>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#5f7a66"/>
      <stop offset="0.35" stop-color="#7f9a86"/>
      <stop offset="0.6" stop-color="#7a957f"/>
      <stop offset="1" stop-color="#55705c"/>
    </linearGradient>
    <linearGradient id="sleeveL" x1="0" x2="1">
      <stop offset="0" stop-color="#4f6955"/>
      <stop offset="1" stop-color="#6f8a76"/>
    </linearGradient>
    <linearGradient id="sleeveR" x1="1" x2="0">
      <stop offset="0" stop-color="#4b6551"/>
      <stop offset="1" stop-color="#6c8773"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86a08c"/>
      <stop offset="1" stop-color="#6a8571"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg)"/>
  <ellipse cx="250" cy="440" rx="170" ry="16" fill="#000" opacity="0.14" filter="url(#soft)"/>

